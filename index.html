<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Hub: Repair Orders, Tool Tracker & Timeclock</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: system-ui, -apple-system, sans-serif; transition: background-color 0.3s, color 0.3s; }
    .glass { backdrop-filter: blur(10px); }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.5); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.8); }
  </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 transition-colors">

  <!-- TOP BAR -->
  <header class="max-w-6xl mx-auto w-full mb-6 flex flex-col sm:flex-row justify-between items-center gap-4">
    <div>
      <h1 class="text-2xl font-bold text-blue-600 dark:text-blue-400"><i class="fa-solid fa-warehouse mr-2"></i> Shop Operations Hub</h1>
      <p class="text-xs text-slate-500 dark:text-slate-400">Manage repair orders, track shop tools, and sync employee timecards.</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="syncStatus" class="text-xs font-semibold px-2 py-1 rounded bg-blue-100 text-blue-800 dark:bg-blue-900/50 dark:text-blue-300 border border-blue-200 dark:border-blue-800 shadow-sm transition-all duration-300">Loading...</span>
      <button onclick="openSettingsModal()" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition" title="Trello & System Settings">
        <i class="fa-solid fa-gear"></i>
      </button>
      <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition">
        <svg id="themeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
      </button>
    </div>
  </header>

  <!-- APP TOGGLE SWITCH -->
  <div class="max-w-6xl mx-auto w-full mb-8 bg-slate-200 dark:bg-slate-800 p-1.5 rounded-xl flex shadow-inner border border-slate-300 dark:border-slate-700">
    <button onclick="switchTab('repair')" id="btn-tab-repair" class="flex-1 py-3 text-center text-sm md:text-base font-bold rounded-lg text-slate-500 dark:text-slate-400 transition-all">
        <i class="fa-solid fa-clipboard-list mr-2"></i> Repair Orders
    </button>
    <button onclick="switchTab('tools')" id="btn-tab-tools" class="flex-1 py-3 text-center text-sm md:text-base font-bold rounded-lg text-slate-500 dark:text-slate-400 transition-all hover:bg-slate-300/50 dark:hover:bg-slate-700/50">
        <i class="fa-solid fa-wrench mr-2"></i> Tool Tracker
    </button>
    <button onclick="switchTab('time')" id="btn-tab-time" class="flex-1 py-3 text-center text-sm md:text-base font-bold rounded-lg text-slate-500 dark:text-slate-400 transition-all hover:bg-slate-300/50 dark:hover:bg-slate-700/50">
        <i class="fa-solid fa-clock mr-2"></i> Time & Trello
    </button>
  </div>

  <!-- DYNAMIC CONTENT CONTAINER -->
  <div id="app-content" class="max-w-6xl mx-auto w-full flex-1 relative flex flex-col">
    <!-- Pages get injected here -->
  </div>

  <!-- GLOBAL MODAL: SETTINGS -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-6 rounded-xl max-w-lg w-full shadow-2xl space-y-4">
      <h2 class="text-lg font-bold text-blue-600 dark:text-blue-400"><i class="fa-solid fa-gear mr-2"></i> Application Settings</h2>
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="text-xs font-bold text-slate-700 dark:text-slate-300">Configured Timecards (Synced from Google Sheets):</label>
          <button onclick="addTimecardConfigRow()" class="text-xs text-blue-600 font-bold hover:underline">+ Add Card</button>
        </div>
        <div id="timecardConfigsList" class="space-y-2 max-h-40 overflow-y-auto pr-1 border border-slate-200 dark:border-slate-700 p-3 rounded-lg bg-slate-50 dark:bg-slate-900"></div>
      </div>
      <div class="flex justify-end gap-3 pt-3 border-t border-slate-200 dark:border-slate-700">
        <button onclick="closeSettingsModal()" class="px-4 py-2 text-sm text-slate-500 font-semibold">Cancel</button>
        <button onclick="saveSettings()" class="bg-blue-600 text-white px-5 py-2 rounded-lg text-sm font-bold shadow hover:bg-blue-500">Save Settings</button>
      </div>
    </div>
  </div>

  <!-- Main JavaScript File -->
  <script src="js/app.js"></script>
</body>
</html>
