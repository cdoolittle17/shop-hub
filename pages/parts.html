<div class="w-full flex flex-col gap-4">
  <!-- TOP TOOLBAR -->
  <div class="flex justify-between items-center bg-white/70 dark:bg-slate-800/70 p-4 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm glass">
    <div>
      <h2 class="text-xl font-bold text-slate-800 dark:text-slate-100">
        <i class="fa-solid fa-boxes-packing text-blue-500 mr-2"></i> Parts Tracking Board
      </h2>
      <p class="text-xs text-slate-500">Drag cards across stages. Cards in Installed/Returned auto-archive after 24 hours.</p>
    </div>
    <div class="flex gap-2">
      <button onclick="togglePartsView('board')" id="btn-parts-board" class="bg-blue-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow">
        <i class="fa-solid fa-table-columns mr-1"></i> Board
      </button>
      <button onclick="togglePartsView('recall')" id="btn-parts-recall" class="bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold shadow">
        <i class="fa-solid fa-box-archive mr-1"></i> Recall Parts
      </button>
      <button onclick="openAddPartModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold shadow">
        + New Part Request
      </button>
    </div>
  </div>

  <!-- VIEW 1: 6-COLUMN KANBAN BOARD -->
  <div id="parts-board-view" class="grid grid-cols-6 gap-2 w-full overflow-x-auto pb-4">
    <!-- NTO Column -->
    <div class="bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl flex flex-col min-w-[160px]"
         ondragover="allowPartDrop(event)" ondrop="handlePartDrop(event, 'NTO')">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-300 dark:border-slate-700">
        <span class="text-xs font-bold text-amber-600 dark:text-amber-400">NTO (Need To Order)</span>
        <span id="cnt-NTO" class="text-[10px] bg-slate-200 dark:bg-slate-800 font-bold px-1.5 py-0.5 rounded">0</span>
      </div>
      <div id="col-NTO" class="space-y-2 flex-1 min-h-[350px]"></div>
    </div>

    <!-- Ordered Column -->
    <div class="bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl flex flex-col min-w-[160px]"
         ondragover="allowPartDrop(event)" ondrop="handlePartDrop(event, 'Ordered')">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-300 dark:border-slate-700">
        <span class="text-xs font-bold text-blue-600 dark:text-blue-400">Ordered</span>
        <span id="cnt-Ordered" class="text-[10px] bg-slate-200 dark:bg-slate-800 font-bold px-1.5 py-0.5 rounded">0</span>
      </div>
      <div id="col-Ordered" class="space-y-2 flex-1 min-h-[350px]"></div>
    </div>

    <!-- Arrived Column -->
    <div class="bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl flex flex-col min-w-[160px]"
         ondragover="allowPartDrop(event)" ondrop="handlePartDrop(event, 'Arrived')">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-300 dark:border-slate-700">
        <span class="text-xs font-bold text-purple-600 dark:text-purple-400">Arrived</span>
        <span id="cnt-Arrived" class="text-[10px] bg-slate-200 dark:bg-slate-800 font-bold px-1.5 py-0.5 rounded">0</span>
      </div>
      <div id="col-Arrived" class="space-y-2 flex-1 min-h-[350px]"></div>
    </div>

    <!-- Installed Column -->
    <div class="bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl flex flex-col min-w-[160px]"
         ondragover="allowPartDrop(event)" ondrop="handlePartDrop(event, 'Installed')">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-300 dark:border-slate-700">
        <span class="text-xs font-bold text-emerald-600 dark:text-emerald-400">Installed</span>
        <span id="cnt-Installed" class="text-[10px] bg-slate-200 dark:bg-slate-800 font-bold px-1.5 py-0.5 rounded">0</span>
      </div>
      <div id="col-Installed" class="space-y-2 flex-1 min-h-[350px]"></div>
    </div>

    <!-- NTR Column -->
    <div class="bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl flex flex-col min-w-[160px]"
         ondragover="allowPartDrop(event)" ondrop="handlePartDrop(event, 'NTR')">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-300 dark:border-slate-700">
        <span class="text-xs font-bold text-rose-600 dark:text-rose-400">NTR (Need To Return)</span>
        <span id="cnt-NTR" class="text-[10px] bg-slate-200 dark:bg-slate-800 font-bold px-1.5 py-0.5 rounded">0</span>
      </div>
      <div id="col-NTR" class="space-y-2 flex-1 min-h-[350px]"></div>
    </div>

    <!-- Returned Column -->
    <div class="bg-slate-100 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-800 p-2.5 rounded-xl flex flex-col min-w-[160px]"
         ondragover="allowPartDrop(event)" ondrop="handlePartDrop(event, 'Returned')">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-300 dark:border-slate-700">
        <span class="text-xs font-bold text-slate-500">Returned</span>
        <span id="cnt-Returned" class="text-[10px] bg-slate-200 dark:bg-slate-800 font-bold px-1.5 py-0.5 rounded">0</span>
      </div>
      <div id="col-Returned" class="space-y-2 flex-1 min-h-[350px]"></div>
    </div>
  </div>

  <!-- VIEW 2: RECALL PARTS ARCHIVE -->
  <div id="parts-recall-view" class="hidden glass bg-white/70 dark:bg-slate-800/70 p-6 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
    <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="relative flex-1 w-full">
        <input type="text" id="recallSearchInput" onkeyup="renderRecallParts()" placeholder="Search archived parts by Tag, Vehicle, or Description..." 
               class="w-full p-2.5 pl-9 rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 text-sm">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400"></i>
      </div>
    </div>
    <div id="recall-list-container" class="space-y-2 max-h-[500px] overflow-y-auto pr-1"></div>
  </div>
</div>

<!-- MODAL: ADD NEW PART -->
<div id="addPartModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
  <div class="glass bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-6 rounded-xl max-w-md w-full shadow-2xl space-y-4">
    <h2 class="text-lg font-bold text-blue-600 dark:text-blue-400"><i class="fa-solid fa-cart-plus mr-2"></i> New Part Request (NTO)</h2>
    <div class="grid grid-cols-3 gap-2">
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Year</label>
        <input type="text" id="part-year" placeholder="2018" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm font-bold">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Make</label>
        <input type="text" id="part-make" placeholder="Ford" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm font-bold">
      </div>
      <div>
        <label class="text-xs font-bold text-slate-500 block mb-1">Model</label>
        <input type="text" id="part-model" placeholder="F-150" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm font-bold">
      </div>
    </div>
    <div>
      <label class="text-xs font-bold text-slate-500 block mb-1">3-Digit Tag #</label>
      <input type="text" id="part-tag" maxlength="3" placeholder="402" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm font-bold font-mono">
    </div>
    <div>
      <label class="text-xs font-bold text-slate-500 block mb-1">Part Description</label>
      <textarea id="part-desc" placeholder="e.g. Front Brake Pads & Rotors" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm h-20"></textarea>
    </div>
    <div class="flex justify-end gap-3 pt-2">
      <button onclick="closeAddPartModal()" class="px-4 py-2 text-sm text-slate-500">Cancel</button>
      <button onclick="saveNewPartRequest()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-sm font-bold shadow">Add to NTO</button>
    </div>
  </div>
</div>
