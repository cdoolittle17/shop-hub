<div class="flex justify-end mb-4 w-full">
    <button onclick="openAddJobModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition shadow-lg">
        + Add New Repair Job
    </button>
</div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 w-full">
    <section class="glass bg-white/70 border border-slate-200 dark:bg-slate-800/70 dark:border-slate-700/50 p-5 rounded-xl flex flex-col h-[calc(100vh-270px)] min-h-[500px] shadow-sm">
        <input type="text" id="jobSearchInput" onkeyup="renderRepairCategories()" placeholder="Search jobs (e.g. Compressor, Brake Pads)..." 
            class="w-full bg-slate-100 border border-slate-300 dark:bg-slate-900 dark:border-slate-700 rounded-lg p-3 mb-4 text-sm focus:outline-none focus:border-blue-500 shadow-inner transition-colors text-slate-800 dark:text-slate-100">
        <div id="jobListContainer" class="flex-1 overflow-y-auto pr-2 space-y-4"></div>
    </section>
    <section class="glass bg-white/70 border border-slate-200 dark:bg-slate-800/70 dark:border-slate-700/50 p-5 rounded-xl col-span-1 md:col-span-2 flex flex-col justify-between h-[calc(100vh-270px)] min-h-[500px] shadow-sm">
        <div id="detailsContainer" class="overflow-y-auto pr-2 pb-4">
          <div class="text-slate-400 text-center mt-20">Select a job from the list on the left to view required and recommended parts/services.</div>
        </div>
        <div id="actionFooter" class="border-t border-slate-200 dark:border-slate-700 pt-4 mt-auto hidden shrink-0">
          <div class="flex flex-col sm:flex-row justify-between items-center gap-3">
              <span id="toastMsg" class="text-sm font-semibold text-emerald-500 opacity-0 transition-opacity duration-300">Copied to clipboard!</span>
              <div class="flex gap-2 w-full sm:w-auto">
                <button onclick="deleteCurrentJob()" class="bg-red-100 hover:bg-red-200 text-red-700 border border-red-300 dark:bg-red-900/40 dark:hover:bg-red-800/60 dark:text-red-300 dark:border-red-700 px-3 py-2 rounded-lg text-xs font-semibold transition">Delete Job</button>
                <button onclick="copyJobToClipboard()" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2 rounded-lg font-bold text-sm shadow-lg transition">Copy Order Summary</button>
              </div>
          </div>
        </div>
    </section>
</div>

<!-- MODAL: REPAIR JOB ADDITION -->
<div id="addJobModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="glass bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-6 rounded-xl max-w-md w-full shadow-2xl space-y-3">
      <h2 class="text-lg font-bold text-blue-600 dark:text-blue-400">Add New Repair Job</h2>
      <div>
        <label class="text-xs font-semibold text-slate-500 mb-1 block">Category:</label>
        <select id="newCatSelect" onchange="handleJobCategoryChange()" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm"></select>
        <input type="text" id="newCatCustom" placeholder="New Category Name..." class="w-full mt-2 bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm hidden">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 mb-1 block">Job Title:</label>
        <input type="text" id="newJob" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm">
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 mb-1 block">Required Services (comma separated):</label>
        <textarea id="newReq" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm h-14"></textarea>
      </div>
      <div>
        <label class="text-xs font-semibold text-slate-500 mb-1 block">Recommended Services (comma separated):</label>
        <textarea id="newRec" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-2 rounded text-sm h-14"></textarea>
      </div>
      <div class="flex justify-end gap-3 mt-4">
        <button onclick="closeAddJobModal()" class="px-4 py-2 text-sm text-slate-500">Cancel</button>
        <button onclick="saveNewRepairJob()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-lg text-sm font-bold shadow">Save Job</button>
      </div>
    </div>
</div>
