<div class="max-w-3xl mx-auto flex flex-col gap-6">
    <div class="glass bg-white/70 border border-slate-200 dark:bg-slate-800/70 dark:border-slate-700/50 p-6 rounded-xl shadow-sm text-center">
        <h2 class="text-2xl font-black text-slate-800 dark:text-slate-100 mb-2"><i class="fa-solid fa-droplet text-blue-500 mr-2"></i> Transmission Fluid Lookup</h2>
        <p class="text-sm text-slate-500 mb-6">Select a vehicle to determine bulk compatibility vs. shelf fluid.</p>
        
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-left">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Year</label>
                <select id="fluid-year" onchange="fluidDropdownUpdate('year')" class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-3 rounded-lg text-sm font-bold disabled:opacity-50">
                    <option value="">Select Year...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Make</label>
                <select id="fluid-make" onchange="fluidDropdownUpdate('make')" disabled class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-3 rounded-lg text-sm font-bold disabled:opacity-50">
                    <option value="">Select Make...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Model</label>
                <select id="fluid-model" onchange="fluidDropdownUpdate('model')" disabled class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-3 rounded-lg text-sm font-bold disabled:opacity-50">
                    <option value="">Select Model...</option>
                </select>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Engine / Trans</label>
                <select id="fluid-engine" onchange="fluidDropdownUpdate('engine')" disabled class="w-full bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 p-3 rounded-lg text-sm font-bold disabled:opacity-50">
                    <option value="">Select Engine...</option>
                </select>
            </div>
        </div>
    </div>

    <!-- RESULT CARD -->
    <div id="fluid-result-card" class="hidden rounded-xl p-6 shadow-lg border-2 transition-all duration-300 text-center">
        <div class="text-xs font-black uppercase tracking-widest mb-1 opacity-75" id="fluid-result-type"></div>
        <h3 class="text-3xl font-black mb-4" id="fluid-result-bottle"></h3>
        
        <div class="bg-black/10 dark:bg-black/20 rounded-lg p-4 inline-block text-left min-w-[250px]">
            <div class="text-sm mb-1"><strong>OEM Spec:</strong> <span id="fluid-result-spec"></span></div>
            <div class="text-sm"><strong>Notes:</strong> <span id="fluid-result-notes"></span></div>
        </div>
    </div>
</div>
